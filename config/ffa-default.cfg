// Re-applied by KTX whenever an FFA map starts.
samelevel 0
set k_mode 3
set k_matchless 1
set k_matchless_countdown 0
set k_autoreset 0
teamplay 0
deathmatch 3
set k_overtime 2
set k_pow 1
set k_pow_min_players 3
set k_pow_check_time 10
set k_idletime 180
set k_vwep 1
set k_no_vote_map 0
set k_no_vote_break 0

exec runtime/server.cfg
exec runtime/mapcycle.cfg
