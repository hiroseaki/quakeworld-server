name: Propose upstream updates
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: versions
        name: Resolve upstream revisions and update pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-upstream.py --write > "$RUNNER_TEMP/upstream.md"
      - name: Create or update draft pull request
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/upstream-versions
          commit-message: Update pinned upstream components
          title: Update MVDSV, KTX, qwfwd and QTV pins
          body-path: ${{ runner.temp }}/upstream.md
          add-paths: Dockerfile
          draft: true
