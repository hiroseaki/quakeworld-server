name: quakeworld

x-runtime: &runtime
  image: ${QW_IMAGE:?Set QW_IMAGE to a published image}
  pull_policy: always
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
  read_only: true
  tmpfs:
    - /nquake/ktx/runtime:uid=10001,gid=10001,mode=0700
    - /tmp:uid=10001,gid=10001,mode=0700
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 2.0
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  ffa:
    <<: *runtime
    profiles: [ffa]
    environment:
      QW_SERVICE: server
      QW_MODE: ffa
      QW_PORT: 27500
      QW_HOSTNAME: ${FFA_HOSTNAME:-QuakeWorld FFA}
      QW_DEFAULT_MODE: ${FFA_MODE:-1on1}
      QW_QTV_ENABLED: ${QW_QTV_ENABLED:-1}
      QW_MAPCYCLE_FILE: /config/mapcycle.txt
    ports:
      - "${FFA_PORT:-27500}:27500/udp"
    volumes:
      - ${QW_PAK_DIR:-./pak_files}:/nquake/id1:ro
      - ./data/maps:/nquake/qw/maps:ro
      - ./data/locs:/nquake/qw/locs:ro
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro
      - ffa-logs:/nquake/logs
      - ffa-demos:/nquake/ktx/demos

  ktx-1:
    <<: *runtime
    profiles: [ktx]
    environment:
      QW_SERVICE: server
      QW_MODE: ktx
      QW_PORT: 27500
      QW_HOSTNAME: ${KTX1_HOSTNAME:-QuakeWorld KTX-1}
      QW_DEFAULT_MODE: ${KTX1_MODE:-1on1}
      QW_QTV_ENABLED: ${QW_QTV_ENABLED:-1}
      QW_MAPCYCLE_FILE: /config/mapcycle.txt
    ports:
      - "${KTX1_PORT:-27501}:27500/udp"
    volumes:
      - ${QW_PAK_DIR:-./pak_files}:/nquake/id1:ro
      - ./data/maps:/nquake/qw/maps:ro
      - ./data/locs:/nquake/qw/locs:ro
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro
      - ktx-1-logs:/nquake/logs
      - ktx-1-demos:/nquake/ktx/demos

  ktx-2:
    <<: *runtime
    profiles: [ktx]
    environment:
      QW_SERVICE: server
      QW_MODE: ktx
      QW_PORT: 27500
      QW_HOSTNAME: ${KTX2_HOSTNAME:-QuakeWorld KTX-2}
      QW_DEFAULT_MODE: ${KTX2_MODE:-1on1}
      QW_QTV_ENABLED: ${QW_QTV_ENABLED:-1}
      QW_MAPCYCLE_FILE: /config/mapcycle.txt
    ports:
      - "${KTX2_PORT:-27502}:27500/udp"
    volumes:
      - ${QW_PAK_DIR:-./pak_files}:/nquake/id1:ro
      - ./data/maps:/nquake/qw/maps:ro
      - ./data/locs:/nquake/qw/locs:ro
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro
      - ktx-2-logs:/nquake/logs
      - ktx-2-demos:/nquake/ktx/demos

  ktx-3:
    <<: *runtime
    profiles: [ktx]
    environment:
      QW_SERVICE: server
      QW_MODE: ktx
      QW_PORT: 27500
      QW_HOSTNAME: ${KTX3_HOSTNAME:-QuakeWorld KTX-3}
      QW_DEFAULT_MODE: ${KTX3_MODE:-2on2}
      QW_QTV_ENABLED: ${QW_QTV_ENABLED:-1}
      QW_MAPCYCLE_FILE: /config/mapcycle.txt
    ports:
      - "${KTX3_PORT:-27503}:27500/udp"
    volumes:
      - ${QW_PAK_DIR:-./pak_files}:/nquake/id1:ro
      - ./data/maps:/nquake/qw/maps:ro
      - ./data/locs:/nquake/qw/locs:ro
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro
      - ktx-3-logs:/nquake/logs
      - ktx-3-demos:/nquake/ktx/demos

  ktx-4:
    <<: *runtime
    profiles: [ktx]
    environment:
      QW_SERVICE: server
      QW_MODE: ktx
      QW_PORT: 27500
      QW_HOSTNAME: ${KTX4_HOSTNAME:-QuakeWorld KTX-4}
      QW_DEFAULT_MODE: ${KTX4_MODE:-4on4}
      QW_QTV_ENABLED: ${QW_QTV_ENABLED:-1}
      QW_MAPCYCLE_FILE: /config/mapcycle.txt
    ports:
      - "${KTX4_PORT:-27504}:27500/udp"
    volumes:
      - ${QW_PAK_DIR:-./pak_files}:/nquake/id1:ro
      - ./data/maps:/nquake/qw/maps:ro
      - ./data/locs:/nquake/qw/locs:ro
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro
      - ktx-4-logs:/nquake/logs
      - ktx-4-demos:/nquake/ktx/demos

  ctf:
    <<: *runtime
    profiles: [ctf]
    environment:
      QW_SERVICE: server
      QW_MODE: ctf
      QW_TIMELIMIT: ${CTF_TIMELIMIT:-10}
      QW_FRAGLIMIT: ${CTF_FRAGLIMIT:-0}
      QW_START_MAP: ${CTF_START_MAP:-}
      QW_MAPCYCLE_RANDOM: ${CTF_MAPCYCLE_RANDOM:-0}
      QW_PORT: 27500
      QW_HOSTNAME: ${CTF_HOSTNAME:-QuakeWorld CTF}
      QW_QTV_ENABLED: ${QW_QTV_ENABLED:-1}
      QW_MAPCYCLE_FILE: /config/ctf-mapcycle.txt
    ports:
      - "${CTF_PORT:-27505}:27500/udp"
    volumes:
      - ${QW_PAK_DIR:-./pak_files}:/nquake/id1:ro
      - ./data/maps:/nquake/qw/maps:ro
      - ./data/locs:/nquake/qw/locs:ro
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro
      - ctf-logs:/nquake/logs
      - ctf-demos:/nquake/ktx/demos

  ra:
    <<: *runtime
    profiles: [ra]
    environment:
      QW_SERVICE: server
      QW_MODE: ra
      QW_TIMELIMIT: ${RA_TIMELIMIT:-10}
      QW_FRAGLIMIT: ${RA_FRAGLIMIT:-10}
      QW_START_MAP: ${RA_START_MAP:-}
      QW_MAPCYCLE_RANDOM: ${RA_MAPCYCLE_RANDOM:-0}
      QW_PORT: 27500
      QW_HOSTNAME: ${RA_HOSTNAME:-QuakeWorld Rocket Arena}
      QW_QTV_ENABLED: ${QW_QTV_ENABLED:-1}
      QW_MAPCYCLE_FILE: /config/ra-mapcycle.txt
    ports:
      - "${RA_PORT:-27506}:27500/udp"
    volumes:
      - ${QW_PAK_DIR:-./pak_files}:/nquake/id1:ro
      - ./data/maps:/nquake/qw/maps:ro
      - ./data/locs:/nquake/qw/locs:ro
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro
      - ra-logs:/nquake/logs
      - ra-demos:/nquake/ktx/demos

  qtv:
    <<: *runtime
    profiles: [qtv]
    environment:
      QW_SERVICE: qtv
      QTV_SOURCES: ${QTV_SOURCES:-ffa:27500 ktx-1:27500 ktx-2:27500 ktx-3:27500 ktx-4:27500}
    ports:
      - "${QTV_PORT:-28000}:${QTV_PORT:-28000}/tcp"
    volumes:
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro

  qwfwd:
    <<: *runtime
    profiles: [proxy]
    environment:
      QW_SERVICE: qwfwd
    ports:
      - "${QWFWD_PORT:-30000}:${QWFWD_PORT:-30000}/udp"
    volumes:
      - ./config:/config:ro
      - ./.secrets:/run/secrets:ro

volumes:
  ffa-logs:
  ffa-demos:
  ktx-1-logs:
  ktx-1-demos:
  ktx-2-logs:
  ktx-2-demos:
  ktx-3-logs:
  ktx-3-demos:
  ktx-4-logs:
  ktx-4-demos:
  ctf-logs:
  ctf-demos:
  ra-logs:
  ra-demos:
